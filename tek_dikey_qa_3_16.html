<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kırık Mühür | 3.16 Dikey Kamera Denetimi</title><style>*{box-sizing:border-box}body{margin:0;background:#07131f;color:#fff1c7;font:13px system-ui;padding:10px;text-align:center}header{padding:8px}button{font-weight:800;background:#275469;color:#fff;border:1px solid #c7a468;border-radius:6px;padding:10px 12px;margin:3px}button.active{background:#9b6338}iframe{border:3px solid #cfab6d;display:block;margin:10px auto;max-width:none;background:#0c1722}#result{max-width:700px;margin:8px auto 10px;padding:12px;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#122b34;border:1px solid #668899;line-height:1.45;font-size:12px}</style></head><body><header><strong>GERÇEK DİKEY OYUN İÇİN KONTROL</strong><div>Yalnızca bir oyun penceresi açık. Boyutları değiştirip karşılaştırabilirsin.</div></header><nav><button onclick="size(360,800,this)" class="active">360 × 800</button><button onclick="size(393,852,this)">393 × 852</button><button onclick="size(412,915,this)">412 × 915</button></nav><pre id="result">Ekran ölçülüyor...</pre><iframe id="sim" width="360" height="800" title="Dikey oyun" src="./hud_dikey_kamera_test_3_16.html"></iframe><script>
let w=360,h=800;
const frame=document.getElementById('sim'),output=document.getElementById('result');
function size(x,y,button){w=x;h=y;frame.style.width=x+'px';frame.style.height=y+'px';frame.setAttribute('width',x);frame.setAttribute('height',y);document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));requestAnimationFrame(report);setTimeout(report,800)}
const box=(d,sel)=>{const e=d.querySelector(sel);if(!e)return 'YOK';const r=e.getBoundingClientRect(),c=d.defaultView.getComputedStyle(e);return [Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)].join(', ')+'; display:'+c.display+'; position:'+c.position};
function report(){try{const doc=frame.contentDocument,win=frame.contentWindow;const isPortrait=win.matchMedia('(orientation:portrait)').matches;const docHeight=doc.documentElement.scrollHeight;const docWidth=doc.documentElement.scrollWidth;const f=doc.getElementById('fatal');const game=doc.getElementById('game');const info=win.__kmTest?.get?.();output.textContent=['GÖRÜNÜM:'+w+'×'+h,'iframe iç çözünürlük:'+win.innerWidth+'×'+win.innerHeight,'orientation:portrait:'+isPortrait,'yatay taşma:'+Math.max(0,docWidth-win.innerWidth)+'px','dikey taşma:'+Math.max(0,docHeight-win.innerHeight)+'px','HUD ÜST: '+box(doc,'.top'),'MINI HARİTA: '+box(doc,'.minimapFrame'),'ALT MENÜ: '+box(doc,'.topRail'),'GÖREV: '+box(doc,'.quest'),'SKILL: '+box(doc,'.bottomright'),'JOYSTICK: '+box(doc,'.bottomleft'),'GÜNLÜK: '+box(doc,'.battleLog'),'CANVAS: '+box(doc,'#game'),'JS HATA: '+(f&&getComputedStyle(f).display!=='none'?f.textContent:'yok'),'Oyun durumu: '+(info?info.mode+' • '+info.zone+' • '+info.questPhase:'API erişilemiyor')].join('\n')}catch(e){output.textContent='Ölçüm başarısız: '+e.message}}
frame.onload=()=>{setTimeout(report,800)};setInterval(report,2500);
</script></body></html>
